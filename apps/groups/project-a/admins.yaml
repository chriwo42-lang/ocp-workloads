apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: project-a-admins
  annotations:
    # Wave -1: Gruppen müssen vor AppProjects (Wave -1, gleiche Wave aber
    # alphabetisch nach groups/) und vor RoleBindings (Wave 0 via
    # namespace-config-app) existieren.
    argocd.argoproj.io/sync-wave: "-1"
    # Zuweisung zu Namespaces erfolgt via namespace-config Chart (rbac.adminGroups)
    # Berechtigungen: admin-RoleBinding in allen project-a-* Namespaces
users: []
# users:
#   - alice
#   - bob
