apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: project-b
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Project B – Applikationen und Namespace-Konfiguration
  sourceRepos:
    - https://github.com/chriwo42-lang/ocp-workloads.git
    - https://github.com/chriwo42-lang/my-app.git
    - https://github.com/chriwo42-lang/your-app.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: project-b-*
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: project-b-admin
      description: Vollzugriff auf alle ArgoCD Apps in project-b (nur cluster-admins)
      policies:
        - p, proj:project-b:project-b-admin, applications, *, project-b/*, allow
      groups:
        - cluster-admins
