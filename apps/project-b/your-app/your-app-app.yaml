apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-b-your-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: project-b
  source:
    repoURL: https://github.com/chriwo42-lang/your-app.git
    targetRevision: main
    path: helm
    helm:
      releaseName: your-app
  destination:
    server: https://kubernetes.default.svc
    namespace: project-b-your-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
