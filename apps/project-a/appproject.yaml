apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: project-a
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Project A – Applikationen und Namespace-Konfiguration
  sourceRepos:
    - https://github.com/chriwo42-lang/ocp-workloads.git
    - https://github.com/chriwo42-lang/my-app.git
    - https://github.com/chriwo42-lang/your-app.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: project-a-*
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: project-a-admin
      description: Vollzugriff auf alle Apps in project-a
      policies:
        - p, proj:project-a:project-a-admin, applications, *, project-a/*, allow
      groups:
        - project-a-admins
    - name: project-a-developer
      description: Deployment-Rechte auf alle Apps in project-a
      policies:
        - p, proj:project-a:project-a-developer, applications, get, project-a/*, allow
        - p, proj:project-a:project-a-developer, applications, sync, project-a/*, allow
        - p, proj:project-a:project-a-developer, applications, override, project-a/*, allow
      groups:
        - project-a-developers
    - name: project-a-viewer
      description: Lesezugriff auf alle Apps in project-a
      policies:
        - p, proj:project-a:project-a-viewer, applications, get, project-a/*, allow
      groups:
        - project-a-viewers
