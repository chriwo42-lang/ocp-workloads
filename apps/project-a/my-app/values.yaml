# Namespace-Konfiguration für project-a/my-app
# Überschreibt die Defaults aus charts/namespace-config/values.yaml

namespace: project-a-my-app
displayName: "Project A – My App"
project: project-a

quota:
  enabled: true
  pods: "10"
  limitsCpu: "2"
  limitsMemory: "4Gi"
  requestsCpu: "500m"
  requestsMemory: "1Gi"
  services: "10"
  secrets: "20"
  configmaps: "20"

limitRange:
  enabled: true
  default:
    cpu: "200m"
    memory: "256Mi"
  defaultRequest:
    cpu: "50m"
    memory: "64Mi"
  max:
    cpu: "1"
    memory: "2Gi"

networkPolicy:
  enabled: true
  allowFromIngress: true
  allowFromSameNamespace: true
  additionalIngressNamespaces: []

rbac:
  adminGroups:
    - project-a-admins
  editGroups:
    - project-a-developers
  viewGroups: []
  adminUsers: []
  editUsers: []
