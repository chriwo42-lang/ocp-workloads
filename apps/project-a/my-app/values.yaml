# App-Konfiguration für project-a/my-app
app: my-app
project: project-a
# namespace wird automatisch zu "project-a-my-app" wenn nicht gesetzt
displayName: "Project A - My App"

appRepo:
  url: https://github.com/chriwo42-lang/my-app.git
  targetRevision: main
  path: helm

quota:
  enabled: true
  pods: "10"
  limitsCpu: "2"
  limitsMemory: "4Gi"
  requestsCpu: "500m"
  requestsMemory: "1Gi"
  services: "10"
  secrets: "20"
  configmaps: "20"

limitRange:
  enabled: true
  default:
    cpu: "200m"
    memory: "256Mi"
  defaultRequest:
    cpu: "50m"
    memory: "64Mi"
  max:
    cpu: "1"
    memory: "2Gi"

networkPolicy:
  enabled: true
  allowFromIngress: true
  allowFromSameNamespace: true
  allowEgressSameNamespace: true
  additionalIngressNamespaces: []

rbac:
  adminGroups:
    - team-a
  editGroups:
    - team-b
  viewGroups: []
  adminUsers: []
  editUsers: []
  viewUsers: []
