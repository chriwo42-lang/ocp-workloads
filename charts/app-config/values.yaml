# Default-Werte für den app-config Chart.
# Pflichtfelder müssen in der jeweiligen app/values.yaml gesetzt werden.

# -- Name der App (Pflichtfeld)
app: ""

# -- Zugehöriges Projekt (Pflichtfeld)
project: ""

# -- Namespace: wird automatisch zu "<project>-<app>" wenn nicht gesetzt
namespace: ""

# -- Anzeigename für den Namespace
displayName: ""

# -- App-Repo der Entwickler (Pflichtfeld: url)
appRepo:
  url: ""
  targetRevision: main
  path: helm
  releaseName: ""

# -- ResourceQuota
quota:
  enabled: true
  pods: "20"
  limitsCpu: "4"
  limitsMemory: "8Gi"
  requestsCpu: "2"
  requestsMemory: "4Gi"
  services: "20"
  secrets: "50"
  configmaps: "50"

# -- LimitRange
limitRange:
  enabled: true
  default:
    cpu: "500m"
    memory: "512Mi"
  defaultRequest:
    cpu: "100m"
    memory: "128Mi"
  max:
    cpu: "2"
    memory: "4Gi"

# -- NetworkPolicy
networkPolicy:
  enabled: true
  allowFromIngress: true
  allowFromSameNamespace: true
  allowEgressSameNamespace: true
  additionalIngressNamespaces: []

# -- RBAC
rbac:
  adminGroups: []
  editGroups: []
  viewGroups: []
  adminUsers: []
  editUsers: []
  viewUsers: []
