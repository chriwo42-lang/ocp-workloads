{{- if not .Values.app }}
  {{- fail "app ist ein Pflichtfeld und muss in values.yaml gesetzt werden" }}
{{- end }}
{{- if not .Values.project }}
  {{- fail "project ist ein Pflichtfeld und muss in values.yaml gesetzt werden" }}
{{- end }}
{{- $namespace := .Values.namespace | default (printf "%s-%s" .Values.project .Values.app) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: {{ .Values.project }}
    # Pod Security Admission (OpenShift 4.11+)
    # warn:    Verstösse werden als Warning geloggt, aber nicht blockiert
    # audit:   Verstösse werden in Audit-Log geschrieben
    # enforce: Verstösse werden blockiert
    pod-security.kubernetes.io/enforce: {{ .Values.security.podSecurityEnforce }}
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: {{ .Values.security.podSecurityAudit }}
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: {{ .Values.security.podSecurityWarn }}
    pod-security.kubernetes.io/warn-version: latest
  annotations:
    {{- if .Values.displayName }}
    openshift.io/display-name: {{ .Values.displayName | quote }}
    {{- end }}
