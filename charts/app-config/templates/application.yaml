{{- if not .Values.appRepo.url }}
  {{- fail "appRepo.url ist ein Pflichtfeld und muss in values.yaml gesetzt werden" }}
{{- end }}
{{- $namespace := .Values.namespace | default (printf "%s-%s" .Values.project .Values.app) }}
{{- $releaseName := .Values.appRepo.releaseName | default .Values.app }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.project }}-{{ .Values.app }}
  namespace: openshift-gitops
  annotations:
    # AppProject (Wave -1) und Teams (Wave -1) müssen vorher existieren.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ .Values.appRepo.url | quote }}
    targetRevision: {{ .Values.appRepo.targetRevision }}
    path: {{ .Values.appRepo.path }}
    helm:
      releaseName: {{ $releaseName }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
