# Default-Werte für den namespace-config Chart.
# Alle Werte können in der jeweiligen App-values.yaml überschrieben werden.

# -- Name des Namespaces (Pflichtfeld, muss in der App-values.yaml gesetzt werden)
namespace: ""

# -- Anzeigename für Annotations
displayName: ""

# -- Zugehöriges Projekt (wird als Label gesetzt)
project: ""

# -- ResourceQuota
quota:
  enabled: true
  pods: "20"
  limitsCpu: "4"
  limitsMemory: "8Gi"
  requestsCpu: "2"
  requestsMemory: "4Gi"
  services: "20"
  secrets: "50"
  configmaps: "50"

# -- LimitRange: Default-Limits für einzelne Container
limitRange:
  enabled: true
  default:
    cpu: "500m"
    memory: "512Mi"
  defaultRequest:
    cpu: "100m"
    memory: "128Mi"
  max:
    cpu: "2"
    memory: "4Gi"

# -- NetworkPolicy
networkPolicy:
  enabled: true
  # Eingehender Traffic vom OpenShift Ingress (Router) erlauben
  allowFromIngress: true
  # Eingehender Traffic innerhalb desselben Namespace erlauben
  allowFromSameNamespace: true
  # Ausgehender Traffic innerhalb desselben Namespace erlauben
  allowEgressSameNamespace: true
  # Zusätzliche Namespaces von denen eingehender Traffic erlaubt ist
  # (z.B. openshift-monitoring für Prometheus Scraping)
  additionalIngressNamespaces: []
  #  - openshift-monitoring

# -- RBAC
rbac:
  # Gruppen mit admin-Rolle im Namespace
  adminGroups: []
  #  - project-a-admins
  # Gruppen mit edit-Rolle im Namespace
  editGroups: []
  #  - project-a-developers
  # Gruppen mit view-Rolle im Namespace
  viewGroups: []
  # Einzelne User mit admin-Rolle (bevorzugt Gruppen verwenden)
  adminUsers: []
  # Einzelne User mit edit-Rolle
  editUsers: []
  # Einzelne User mit view-Rolle
  viewUsers: []
