{{- if not .Values.project }}
  {{- fail "project ist ein Pflichtfeld und muss in appproject-values.yaml gesetzt werden" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project }}
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: {{ .Values.description | default (printf "%s – Applikationen und Namespace-Konfiguration" .Values.project) | quote }}
  sourceRepos:
    {{- range .Values.sourceRepos }}
    - {{ . | quote }}
    {{- end }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.project }}-*
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: {{ .Values.project }}-admin
      description: {{ printf "Vollzugriff auf alle ArgoCD Apps in %s (nur cluster-admins)" .Values.project | quote }}
      policies:
        - {{ printf "p, proj:%s:%s-admin, applications, *, %s/*, allow" .Values.project .Values.project .Values.project }}
      groups:
        {{- range .Values.adminGroups }}
        - {{ . }}
        {{- end }}
    {{- if .Values.developerTeams }}
    - name: {{ .Values.project }}-developer
      description: {{ printf "Apps in %s einsehen und manuell synchen" .Values.project | quote }}
      policies:
        - {{ printf "p, proj:%s:%s-developer, applications, get, %s/*, allow" .Values.project .Values.project .Values.project }}
        - {{ printf "p, proj:%s:%s-developer, applications, sync, %s/*, allow" .Values.project .Values.project .Values.project }}
        - {{ printf "p, proj:%s:%s-developer, applications, override, %s/*, allow" .Values.project .Values.project .Values.project }}
      groups:
        {{- range .Values.developerTeams }}
        - {{ . }}
        {{- end }}
    {{- end }}
    {{- if .Values.viewerTeams }}
    - name: {{ .Values.project }}-viewer
      description: {{ printf "Apps in %s nur einsehen (read-only)" .Values.project | quote }}
      policies:
        - {{ printf "p, proj:%s:%s-viewer, applications, get, %s/*, allow" .Values.project .Values.project .Values.project }}
      groups:
        {{- range .Values.viewerTeams }}
        - {{ . }}
        {{- end }}
    {{- end }}
