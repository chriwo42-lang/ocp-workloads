{{- if not .Values.project }}
  {{- fail "project ist ein Pflichtfeld und muss in appproject-values.yaml gesetzt werden" }}
{{- end }}
{{- $argoCDNamespace := "openshift-gitops" }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project }}
  namespace: {{ $argoCDNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: {{ .Values.description | default (printf "%s – Applikationen und Namespace-Konfiguration" .Values.project) | quote }}
  sourceRepos:
    {{- range .Values.sourceRepos }}
    - {{ . | quote }}
    {{- end }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.project }}-*
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    {{- $hasAdmin := or .Values.adminGroups .Values.adminUsers }}
    {{- if $hasAdmin }}
    - name: {{ .Values.project }}-admin
      description: {{ printf "Vollzugriff auf alle ArgoCD Apps in %s" .Values.project | quote }}
      policies:
        - {{ printf "p, proj:%s:%s-admin, applications, *, %s/*, allow" .Values.project .Values.project .Values.project }}
      groups:
        {{- range .Values.adminGroups }}
        - {{ . }}
        {{- end }}
      {{- if .Values.adminUsers }}
      users:
        {{- range .Values.adminUsers }}
        - {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- $hasEdit := or .Values.editGroups .Values.editUsers }}
    {{- if $hasEdit }}
    - name: {{ .Values.project }}-edit
      description: {{ printf "Apps in %s einsehen und manuell synchen" .Values.project | quote }}
      policies:
        - {{ printf "p, proj:%s:%s-edit, applications, get, %s/*, allow" .Values.project .Values.project .Values.project }}
        - {{ printf "p, proj:%s:%s-edit, applications, sync, %s/*, allow" .Values.project .Values.project .Values.project }}
        - {{ printf "p, proj:%s:%s-edit, applications, override, %s/*, allow" .Values.project .Values.project .Values.project }}
      groups:
        {{- range .Values.editGroups }}
        - {{ . }}
        {{- end }}
      {{- if .Values.editUsers }}
      users:
        {{- range .Values.editUsers }}
        - {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- $hasView := or .Values.viewGroups .Values.viewUsers }}
    {{- if $hasView }}
    - name: {{ .Values.project }}-view
      description: {{ printf "Apps in %s nur einsehen (read-only)" .Values.project | quote }}
      policies:
        - {{ printf "p, proj:%s:%s-view, applications, get, %s/*, allow" .Values.project .Values.project .Values.project }}
      groups:
        {{- range .Values.viewGroups }}
        - {{ . }}
        {{- end }}
      {{- if .Values.viewUsers }}
      users:
        {{- range .Values.viewUsers }}
        - {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
