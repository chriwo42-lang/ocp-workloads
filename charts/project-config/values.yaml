# Default-Werte für den project-config Chart.
# Pflichtfelder müssen in der jeweiligen appproject-values.yaml gesetzt werden.

# -- Name des Projekts (Pflichtfeld)
project: ""

# -- Beschreibung des Projekts
description: ""

# -- Source-Repos die dieses AppProject deployen darf.
# ocp-workloads ist immer enthalten (für app-config Chart).
# App-spezifische Repos hier auflisten.
sourceRepos:
  - https://github.com/chriwo42-lang/ocp-workloads.git

# -- ArgoCD-Rollen (nicht OpenShift RBAC)
# Admin: Vollzugriff auf alle Applications (nur Platform-Admins)
adminGroups:
  - cluster-admins

# -- Developer: get, sync, override — können Apps einsehen und manuell synchen
developerTeams: []
# Beispiel:
#   - team-a
#   - team-b

# -- Viewer: get — können Apps nur einsehen (read-only)
viewerTeams: []
# Beispiel:
#   - team-c
