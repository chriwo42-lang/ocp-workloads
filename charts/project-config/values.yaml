# Default-Werte für den project-config Chart.
# Pflichtfelder müssen in appproject-values.yaml gesetzt werden.

# -- Name des Projekts (Pflichtfeld)
project: ""

# -- Beschreibung
description: ""

# -- Erlaubte Source-Repos (ocp-workloads immer enthalten)
sourceRepos:
  - https://github.com/chriwo42-lang/ocp-workloads.git

# -- ArgoCD admin-Rolle: Vollzugriff (nur Platform-Admins)
adminGroups:
  - cluster-admins

# -- ArgoCD developer-Rolle: get, sync, override
# Trägt man hier die Teams ein die in den App-Namespaces
# admin oder edit Zugriff haben — kein separates Feld in app/values.yaml nötig.
developerTeams: []

# -- ArgoCD viewer-Rolle: get (read-only)
viewerTeams: []
